name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-lint-static-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGORA_ENVIRONMENT: test
      AGORA_DEBUG: "false"
      AGORA_PORTAL_SECRET_KEY: portal-test-only-not-a-secret-000000000000000000000000000000000000000000000000
      AGORA_CONTENT_SECRET_KEY: content-test-only-not-a-secret-00000000000000000000000000000000000000000000000
      AGORA_PORTAL_ORIGIN: http://portal.agora.test:8000
      AGORA_CONTENT_ORIGIN: http://content.agorausercontent.test:8001
      AGORA_DB_NAME: agora
      AGORA_DB_USER: agora
      AGORA_DB_PASSWORD: test-only-not-a-secret
      AGORA_DB_HOST: 127.0.0.1
      AGORA_DB_PORT: "5432"
      AGORA_ARTIFACT_ROOT: ${{ github.workspace }}/.local/artifacts
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: agora
          POSTGRES_USER: agora
          POSTGRES_PASSWORD: test-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agora -d agora"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install pinned Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run format, lint, static, database, test, and build gates
        run: uv run --locked python scripts/check.py
