name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-lint-static-test-build:
    # Database tests require a runner with network access to the package-managed Oracle profile.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    env:
      AGORA_ENVIRONMENT: test
      AGORA_TEST_DATABASE_RESET_ALLOWED: "true"
      AGORA_DEBUG: "false"
      AGORA_PORTAL_SECRET_KEY: portal-test-only-not-a-secret-000000000000000000000000000000000000000000000000
      AGORA_CONTENT_SECRET_KEY: content-test-only-not-a-secret-00000000000000000000000000000000000000000000000
      AGORA_PORTAL_ORIGIN: http://portal.agora.test:8000
      AGORA_CONTENT_ORIGIN: http://content.agorausercontent.test:8001
      # ENV is the Treasury Analytics Oracle profile name, not AGORA_ENVIRONMENT;
      # this alias must resolve to CI's dedicated disposable validation schema.
      ENV: PROD
      TA_PROD_PASSWORD: ${{ secrets.TA_PROD_PASSWORD }}
      AGORA_ARTIFACT_ROOT: ${{ github.workspace }}/.local/artifacts
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install pinned Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Install pinned Chromium
        run: uv run --locked python -m playwright install --with-deps chromium

      - name: Run format, lint, static, database, test, and build gates
        run: uv run --locked python scripts/check.py
