name: agora

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_DB: ${AGORA_DB_NAME:?Run the environment bootstrap first}
      POSTGRES_USER: ${AGORA_DB_USER:?Run the environment bootstrap first}
      POSTGRES_PASSWORD: ${AGORA_DB_PASSWORD:?Run the environment bootstrap first}
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "127.0.0.1:${AGORA_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    stop_grace_period: 30s

volumes:
  postgres-data:
