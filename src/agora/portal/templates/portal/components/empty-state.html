<section class="portal-state portal-state--empty"{% if heading_id %} aria-labelledby="{{ heading_id }}"{% endif %}>
  <span class="portal-state__marker" aria-hidden="true">-</span>
  <h2{% if heading_id %} id="{{ heading_id }}"{% endif %}>{{ title|default:'Nothing here yet' }}</h2>
  <p>{{ message }}</p>
  {% if action_url and action_label %}
    <div class="portal-state__actions">
      {% include "portal/components/button.html" with button_href=action_url button_label=action_label button_variant=action_variant|default:'primary' %}
    </div>
  {% endif %}
</section>
