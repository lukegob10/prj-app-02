<div class="portal-form-field">
  <label class="portal-form-field__label" for="{{ field_id }}">
    {{ label }}{% if required %}<span aria-hidden="true"> *</span><span class="portal-visually-hidden"> (required)</span>{% endif %}
  </label>
  {% if help_text %}<p class="portal-form-field__help" id="{{ field_id }}-help">{{ help_text }}</p>{% endif %}
  {% if error %}<p class="portal-form-field__error" id="{{ field_id }}-error" role="alert">{{ error }}</p>{% endif %}
  {% if field_type == 'textarea' %}
    <textarea class="portal-textarea" id="{{ field_id }}" name="{{ field_name }}"{% if help_text and error %} aria-describedby="{{ field_id }}-help {{ field_id }}-error"{% elif help_text %} aria-describedby="{{ field_id }}-help"{% elif error %} aria-describedby="{{ field_id }}-error"{% endif %}{% if error %} aria-invalid="true"{% endif %}{% if required %} required{% endif %}>{{ value }}</textarea>
  {% else %}
    <input class="portal-input" id="{{ field_id }}" name="{{ field_name }}" type="{{ field_type|default:'text' }}" value="{{ value }}"{% if autocomplete %} autocomplete="{{ autocomplete }}"{% endif %}{% if help_text and error %} aria-describedby="{{ field_id }}-help {{ field_id }}-error"{% elif help_text %} aria-describedby="{{ field_id }}-help"{% elif error %} aria-describedby="{{ field_id }}-error"{% endif %}{% if error %} aria-invalid="true"{% endif %}{% if required %} required{% endif %}>
  {% endif %}
</div>
