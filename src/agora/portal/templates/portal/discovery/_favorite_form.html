{% url "project-favorite" project.id as favorite_url %}
<form method="post" action="{{ favorite_url }}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% if project.is_favorite %}
    <input type="hidden" name="favorited" value="0">
    <button
      class="portal-button portal-button--quiet"
      type="submit"
      aria-label="Remove {{ project.name }} from favorites"
      aria-pressed="true"
    >Remove from favorites</button>
  {% else %}
    <input type="hidden" name="favorited" value="1">
    <button
      class="portal-button portal-button--quiet"
      type="submit"
      aria-label="Add {{ project.name }} to favorites"
      aria-pressed="false"
    >Add to favorites</button>
  {% endif %}
</form>
