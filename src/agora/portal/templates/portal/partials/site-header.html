<header class="portal-header">
  <div class="portal-container portal-header__inner">
    <div class="portal-brand-group">
      <a class="portal-brand" href="/" aria-label="Agora home">
        {% include "portal/partials/brand-wordmark.html" %}
      </a>
      {% if environment %}
        <span class="portal-environment">{{ environment }}</span>
      {% endif %}
    </div>

    {% include "portal/partials/primary-nav.html" %}

    {% if account and not hide_account_menu %}
      {% include "portal/partials/account-menu.html" %}
    {% endif %}
  </div>
</header>
